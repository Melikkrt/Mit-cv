  <style>
    :root {
      --bg: #0a1626;
      --bg-2: #0e2036;
      --card: #0f2237;
      --line: #1d3750;
      --text: #f1f6fb;
      --muted: #8aa4bc;
      --accent: #52d3ff;
      --accent-soft: rgba(82, 211, 255, 0.12);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; scroll-padding-top: 80px; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      background-image:
        linear-gradient(rgba(82, 211, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(82, 211, 255, 0.045) 1px, transparent 1px);
      background-size: 40px 40px;
      background-attachment: fixed;
    }

    a { color: inherit; }
    a:focus-visible, button:focus-visible, summary:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 6px;
    }

    .wrap { width: min(700px, calc(100% - 40px)); margin-inline: auto; }
    .wide { width: min(1000px, calc(100% - 40px)); margin-inline: auto; }

    /* Topmenu */
    nav {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(10, 22, 38, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      height: 62px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .logo { font-weight: 800; font-size: 17px; text-decoration: none; }
    .logo span { color: var(--accent); }

    .menu { display: flex; gap: 6px; }

    .menu a {
      padding: 6px 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-decoration: none;
      transition: color .2s;
    }

    .menu a:hover { color: var(--accent); }

    .lang {
      justify-self: end;
      display: flex;
      padding: 3px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 99px;
    }

    .lang button {
      min-width: 38px;
      padding: 4px 10px;
      border: 0;
      border-radius: 99px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .lang button.on { background: var(--accent); color: #05212e; }

    /* Forside */
    .hero { padding: 54px 0 70px; }

    .eyebrow {
      margin: 0 0 18px;
      text-align: center;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .name-row { display: flex; align-items: center; gap: 28px; }

        .avatar {
      flex: none;
      width: 110px; height: 110px;
      object-fit: cover;
      object-position: center 20%;
      border: 3px solid var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 28px rgba(82, 211, 255, 0.35);
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 9vw, 72px);
      line-height: 1.05;
      letter-spacing: -2px;
    }

    .tagline {
      margin: 28px 0 22px;
      min-height: 1.4em;
      color: var(--muted);
      font-size: clamp(24px, 4.5vw, 38px);
      font-weight: 300;
      line-height: 1.3;
    }

    .tagline b { color: var(--accent); font-weight: 700; }
    .caret { display: inline-block; width: 2px; height: 1em; margin-left: 3px; vertical-align: -0.12em; background: var(--accent); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .intro { max-width: 600px; margin: 0 0 32px; color: var(--muted); font-size: 17px; }
    .intro strong { color: var(--text); }

    .buttons { display: flex; flex-wrap: wrap; gap: 14px; }

    .btn {
      display: inline-flex;
      align-items: center;
      min-height: 50px;
      padding: 10px 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s, border-color .2s;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn-fill { background: var(--accent); border-color: var(--accent); color: #05212e; }
    .btn-line { background: var(--bg-2); }
    .btn-line:hover { border-color: var(--accent); }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 24px 52px;
      margin-top: 60px;
      padding-top: 10px;
    }

    .stat strong { display: block; font-size: 38px; font-weight: 800; line-height: 1.2; }
    .stat strong i { color: var(--accent); font-style: normal; }
    .stat span { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; }

    /* Sektioner */
    section.block { padding: 72px 0; border-top: 1px solid var(--line); }

    .kicker {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h2 { margin: 0 0 32px; font-size: clamp(28px, 5vw, 40px); line-height: 1.2; letter-spacing: -1px; }
    h3 { margin: 0 0 4px; font-size: 18px; line-height: 1.45; }
    p { margin: 0 0 16px; }

    .muted { color: var(--muted); }

    /* Erfaring */
    .jobs { display: grid; gap: 16px; }

    details.job {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      transition: border-color .2s;
    }

    details.job:hover, details.job[open] { border-color: #2c5578; }

    details.job summary {
      position: relative;
      padding: 22px 58px 22px 24px;
      cursor: pointer;
      list-style: none;
    }

    details.job summary::-webkit-details-marker { display: none; }

    details.job summary::after {
      content: "+";
      position: absolute;
      right: 24px; top: 18px;
      color: var(--accent);
      font-size: 28px;
      line-height: 1;
    }

    details.job[open] summary::after { content: "−"; }

    .when { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; }
    .body { padding: 0 24px 8px; color: #c5d5e3; font-size: 15px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .chip { padding: 4px 12px; background: var(--accent-soft); border-radius: 6px; color: var(--accent); font-size: 12px; font-weight: 700; }

    /* Kompetencer */
    .skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }

    .skill {
      padding: 22px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      font-weight: 700;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }

    .skill:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 8px 28px rgba(82, 211, 255, 0.12); }
    .skill small { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; font-weight: 400; }

    /* Uddannelse */
    .edu { display: grid; gap: 14px; }

    .edu-item {
      padding: 22px 24px;
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 12px;
    }

    .edu-item p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

    /* Kontakt */
    .contact {
      padding: 46px 30px;
      text-align: center;
      background: linear-gradient(160deg, #123150, var(--card));
      border: 1px solid var(--line);
      border-radius: 20px;
    }

    .contact .buttons { justify-content: center; }

    footer { padding: 30px 20px 50px; text-align: center; color: var(--muted); font-size: 13px; }

    .reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s, transform .7s; }
    .reveal.in { opacity: 1; transform: none; }

    @media (max-width: 720px) {
      .nav-inner { grid-template-columns: auto 1fr auto; gap: 8px; }
      .menu { justify-content: center; gap: 0; }
      .menu a { padding: 6px 7px; font-size: 10px; letter-spacing: .6px; }
      .logo { font-size: 15px; }
      .name-row { flex-direction: column; align-items: flex-start; gap: 18px; }
      .eyebrow { text-align: left; font-size: 11px; letter-spacing: 2px; }
      .stats { gap: 22px 36px; }
      .btn { flex: 1 1 auto; justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal { opacity: 1; transform: none; transition: none; }
      .caret { animation: none; }
      .btn, .skill { transition: none; }
    }

    @media print {
      nav, .buttons, .lang { display: none; }
      body { background: #fff; color: #111; }
      .reveal { opacity: 1; transform: none; }
      :root { --card: #fff; --line: #ccc; --muted: #444; --accent: #12385a; --bg-2: #fff; }
      .body, .tagline { color: #222; }
      section.block { padding: 20px 0; break-inside: avoid; }
    }
  </style>
</head>

    let lang = localStorage.getItem('lang') || 'da';
    let wordIndex = 0, charIndex = 0, deleting = false, timer;

    function apply() {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = T[lang][el.dataset.i18n]);
      document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = T[lang][el.dataset.i18nHtml]);
      document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
      document.title = lang === 'da' ? 'Melik Karatas | Digital Marketing Specialist' : 'Melik Karatas | Digital Marketing Specialist (EN)';
      wordIndex = 0; charIndex = 0; deleting = false;
      clearTimeout(timer); typeLoop();
    }

    document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
      lang = b.dataset.lang; localStorage.setItem('lang', lang); apply();
    }));

    // Skrivemaskine
    const typedEl = document.getElementById('typed');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function typeLoop() {
      const words = T[lang].words;
      if (reduce) { typedEl.textContent = words[0]; return; }
      const word = words[wordIndex];
      typedEl.textContent = word.slice(0, charIndex);
      if (!deleting && charIndex < word.length) { charIndex++; timer = setTimeout(typeLoop, 85); }
      else if (!deleting) { deleting = true; timer = setTimeout(typeLoop, 1500); }
      else if (charIndex > 0) { charIndex--; timer = setTimeout(typeLoop, 45); }
      else { deleting = false; wordIndex = (wordIndex + 1) % words.length; timer = setTimeout(typeLoop, 300); }
    }

    // Tællere
    document.querySelectorAll('[data-count]').forEach(el => {
      const target = parseFloat(el.dataset.count), dec = parseInt(el.dataset.dec || 0), suffix = el.dataset.suffix;
      const plus = el.querySelector('i');
      const start = performance.now();
      const step = now => {
        const p = Math.min((now - start) / 1300, 1);
        const value = (target * p).toFixed(dec).replace('.', ',');
        if (plus) { el.firstChild.textContent = value; } else { el.textContent = value + (suffix || ''); }
        if (p < 1) requestAnimationFrame(step);
      };
      if (plus) el.insertBefore(document.createTextNode('0'), plus);
      requestAnimationFrame(step);
    });

    // Animation ved scroll
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }), { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));

    apply();
  </script>
