<!DOCTYPE html>
<html lang="da" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Melik Karatas | Digital Marketing Specialist</title>
  <meta name="description" content="Interaktivt CV for Melik Karatas, Digital Marketing Specialist med erfaring inden for Google Ads, Meta Ads, SEO og dataanalyse." />

  <style>
    :root {
      --bg: #0b1622;
      --surface: #11202f;
      --surface-2: #172b3e;
      --text: #e6eef6;
      --muted: #9db2c5;
      --line: #223a50;
      --accent: #6fb1e6;
      --accent-2: #3f86bf;
      --on-accent: #08131d;
    }

    [data-theme="light"] {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-2: #eaf1f8;
      --text: #1d2b39;
      --muted: #5f7285;
      --line: #dbe4ed;
      --accent: #1f5f94;
      --accent-2: #12385a;
      --on-accent: #ffffff;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; scroll-padding-top: 90px; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      transition: background .3s, color .3s;
    }

    a { color: var(--accent); }
    a:focus-visible, button:focus-visible, summary:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 6px;
    }

    .progress {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      width: 0;
      background: var(--accent);
      z-index: 50;
    }

    .container { width: min(1000px, calc(100% - 40px)); margin-inline: auto; }

    /* Menu */
    nav {
      position: sticky;
      top: 0;
      z-index: 40;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand { font-weight: 800; color: var(--text); text-decoration: none; }

    .menu { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

    .menu a {
      padding: 6px 12px;
      border-radius: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .menu a:hover, .menu a.active { color: var(--text); background: var(--surface-2); }

    .theme-btn {
      width: 40px; height: 40px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
    }

    /* Forside */
    .hero { padding: 110px 0 80px; }

    .tag {
      display: inline-block;
      padding: 6px 14px;
      margin-bottom: 22px;
      border: 1px solid var(--line);
      border-radius: 99px;
      background: var(--surface);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(44px, 9vw, 86px);
      line-height: 1.02;
      letter-spacing: -3px;
    }

    .typed { color: var(--accent); }
    .cursor { display: inline-block; width: 3px; background: var(--accent); margin-left: 3px; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .hero-sub { max-width: 640px; margin: 0 0 32px; color: var(--muted); font-size: 18px; }

    .actions { display: flex; gap: 12px; flex-wrap: wrap; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 10px 22px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      transition: transform .2s;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .btn-ghost { background: transparent; color: var(--text); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 56px;
    }

    .stat {
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .stat strong { display: block; color: var(--accent); font-size: 34px; line-height: 1.2; }
    .stat span { color: var(--muted); font-size: 14px; }

    /* Sektioner */
    section { padding: 70px 0; }

    .label {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h2 { margin: 0 0 30px; font-size: clamp(28px, 5vw, 40px); line-height: 1.2; letter-spacing: -1px; }
    h3 { margin: 0 0 4px; font-size: 18px; line-height: 1.45; }

    p { margin: 0 0 16px; }
    .muted { color: var(--muted); }

    .card {
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .profile p { max-width: 760px; }

    /* Kompetencer */
    .skill-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }

    .skill {
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      font-weight: 700;
      transition: transform .2s, border-color .2s;
    }

    .skill:hover { transform: translateY(-4px); border-color: var(--accent); }

    /* Erfaring (tidslinje) */
    .timeline { border-left: 2px solid var(--line); margin-left: 8px; padding-left: 28px; }

    details.job {
      position: relative;
      margin-bottom: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    details.job::before {
      content: "";
      position: absolute;
      left: -37px; top: 30px;
      width: 12px; height: 12px;
      background: var(--accent);
      border: 3px solid var(--bg);
      border-radius: 50%;
      box-sizing: content-box;
    }

    details.job summary {
      padding: 22px 56px 22px 24px;
      cursor: pointer;
      list-style: none;
      position: relative;
    }

    details.job summary::-webkit-details-marker { display: none; }

    details.job summary::after {
      content: "+";
      position: absolute;
      right: 22px; top: 20px;
      color: var(--accent);
      font-size: 28px;
      line-height: 1;
    }

    details.job[open] summary::after { content: "−"; }

    .date { color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; }
    .job-body { padding: 0 24px 6px; }
